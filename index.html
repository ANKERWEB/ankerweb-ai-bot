<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ankerweb AI - Vercel Edition</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; margin: 0; color: #e0e0e0; overflow: hidden; }
        #chat-container { display: flex; flex-direction: column; height: 100vh; background: #0f0f0f; }
        .header-status { padding: 12px; text-align: center; font-size: 13px; background: #161616; border-bottom: 1px solid #222; color: #2ed573; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5; word-wrap: break-word; max-width: 85%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user { align-self: flex-end; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: #252525; color: #eee; border-bottom-left-radius: 4px; border: 1px solid #333; }
        #input-area { display: flex; padding: 15px; background: #161616; border-top: 1px solid #222; gap: 10px; align-items: center; }
        .input-wrapper { flex: 1; background: #252525; border-radius: 25px; padding: 2px 15px; border: 1px solid #333; }
        input { flex: 1; border: none; outline: none; background: transparent; color: white; height: 42px; font-size: 16px; width: 100%; }
        button { background: #6c5ce7; border: none; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .typing { display: flex; gap: 5px; }
        .dot { width: 7px; height: 7px; background: #888; border-radius: 50%; animation: blink 1.4s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
</head>
<body>
<div id="chat-container">
    <div class="header-status">● Ankerweb AI Online (Vercel)</div>
    <div id="messages">
        <div class="msg bot">🔥 <b>Yo Arka!</b><br>Ankerweb AI sudah pindah ke Vercel nih. Lebih kenceng dan anti-blokir. Ada yang bisa dibantu?</div>
    </div>
    <div id="input-area">
        <div class="input-wrapper"><input type="text" id="user-input" placeholder="Tulis pesan..." autocomplete="off"></div>
        <button id="send-btn" onclick="sendMessage()"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg></button>
    </div>
</div>
<script>
    document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('messages');
        const btn = document.getElementById('send-btn');
        const text = input.value.trim();
        if (!text) return;

        box.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;
        btn.disabled = true;

        const loadingId = "id-" + Date.now();
        box.innerHTML += `<div class="msg bot" id="${loadingId}"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
        box.scrollTop = box.scrollHeight;

        try {
            // Panggil API Vercel lu sendiri
            const response = await fetch("/api/chat", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            document.getElementById(loadingId).innerHTML = data.reply || "Gagal dapet respon nih.";
        } catch (e) {
            document.getElementById(loadingId).innerHTML = "<b>Koneksi Error!</b><br>Pastikan folder /api/chat.js sudah lu deploy ke Vercel.";
        } finally {
            btn.disabled = false;
            box.scrollTop = box.scrollHeight;
        }
    }
</script>
</body>
</html>
